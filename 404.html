  <style>
    :root {
      --bg: #F4F3EF;
      --fg: #0C0C0C;
      --muted: #8A8A8A;
      --border: #DDDBD5;
      --font: 'GeneralSans-Variable', 'GeneralSans-Regular', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior:auto; }
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    }
    body {
      background:var(--bg); color:var(--fg); font-family:var(--font);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:52px; text-align:center;
    }
    .logo {
      display:inline-block; margin-bottom:56px; color:var(--fg);
      font-family:var(--font); font-size:24px; font-weight:500; line-height:1; letter-spacing:-.04em;
      text-decoration:none;
    }
    .logo-link { color:inherit; text-decoration:none; }
    .code {
      font-size:clamp(80px,16vw,200px); font-weight:500;
      letter-spacing:-.05em; line-height:1; color:transparent;
      -webkit-text-stroke:1.5px rgba(12,12,12,.15);
    }
    .msg { margin-top:28px; font-size:clamp(18px,2.5vw,28px); font-weight:500; letter-spacing:-.02em; }
    .sub { margin-top:14px; font-size:15px; color:var(--muted); line-height:1.6; }
    .back {
      margin-top:52px; display:inline-flex; align-items:center; gap:12px;
      font-size:13px; letter-spacing:.08em; text-transform:uppercase;
      color:var(--fg); text-decoration:none;
      border-bottom:1px solid var(--fg); padding-bottom:2px;
      transition:opacity .3s;
    }
    .back:hover { opacity:.55; }
    .back:focus-visible { outline:2px solid var(--fg); outline-offset:4px; }
  </style>
</head>
<body>
  <a href="/" class="logo-link" aria-label="morfo — inicio">
    <span class="logo">morfo</span>

  <p class="code">404</p>

  <a href="/" class="back">← Volver al inicio</a>
